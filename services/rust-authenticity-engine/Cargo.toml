[package]
name = "lux-raw-authenticity-engine"
version = "1.0.0"
edition = "2021"
authors = ["luxury.Raw Maison Engineering <tech@luxraw.com>"]
description = "Ultra-Fast Rust Cryptographic Digital Passport, Watermark & 3D Fit Matrix Solver"

[dependencies]
actix-web = "4.4.0"
actix-cors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
chrono = { version = "0.4", features = ["serde"] }
